src="https://www.facebook.com/tr?id=3636565639834873&ev=PageView&noscript=1"/></noscript>
<style>
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:#fff; color:#0B2E1C;
    display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; text-align:center; }
  a { color:#128C4A; font-weight:700; }
</style>
</head>
<body>
<p id="fallback" style="display:none">Redirecionando... se nada acontecer, <a id="link" href="#">toque aqui</a>.</p>
<script>
  // Link fixo de segurança — mesmo grupo ativo configurado em
  // scripts/grupos_rotacao.json no momento em que essa página foi publicada.
  // É sobrescrito, quando dá tempo, pelo fetch abaixo.
  var dest = 'https://chat.whatsapp.com/HxzlNHAlZsQBWUh1aQA8Mm';

  var ua = navigator.userAgent || '';
  var isInAppBrowser = /FBAN|FBAV|FB_IAB|Instagram/i.test(ua);
  var isAndroid = /Android/i.test(ua);

  function buildDest(url) {
    if (isInAppBrowser && isAndroid) {
      var withoutScheme = url.replace(/^https?:\/\//, '');
      return 'intent://' + withoutScheme + '#Intent;scheme=https;package=com.whatsapp;S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
    }
    return url;
  }

  // Pedido explícito: sem tela, sem botão — só dispara o Pixel e manda direto
  // pro WhatsApp. Diferença em relação à LP: lá o disparo depende do TOQUE do
  // usuário (gesto síncrono, é o que garante a troca pro app em navegador
  // embutido). Aqui não tem gesto nenhum — é redirecionamento automático no
  // carregamento da página. Em navegador normal (Chrome/Safari) isso tende a
  // funcionar liso. Em navegador embutido (Facebook/Instagram) e em versões
  // recentes do Chrome Android, esquemas de app/intent sem gesto podem ser
  // bloqueados por política do próprio navegador — não é algo que dê pra
  // contornar por código. O link de texto abaixo do corpo é só o plano B
  // visível caso isso aconteça.
  window.location.href = buildDest(dest);

  document.getElementById('link').href = buildDest(dest);
  document.getElementById('fallback').style.display = 'block';

  // Busca o link de convite do grupo ATIVO em tempo real (mesmo arquivo que a
  // LP usa). Não trava a navegação acima — só atualiza o plano B e, se ainda
  // estiver na página, tenta de novo com o link certo.
  fetch('../family/active-invite.json', { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(data){
      if (data && data.inviteUrl && data.inviteUrl !== dest) {
        dest = data.inviteUrl;
        document.getElementById('link').href = buildDest(dest);
      }
    })
    .catch(function(){});
</script>
</body>
</html>
