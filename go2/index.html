<p id="fallback" style="display:none">Redirecionando... se nada acontecer, <a id="link" href="#">toque aqui</a>.</p>
<script>
  // Igual ao /go/ (mesmo Pixel, mesma lógica), só que com destino FIXO —
  // não segue o grupo ativo da rotação automática (active-invite.json), é
  // um link de convite específico passado direto. Criado em 09/09/2026.
  var dest = 'https://chat.whatsapp.com/JkXzvr1KwzX12Jx8Yb8LZG';

  var ua = navigator.userAgent || '';
  var isInAppBrowser = /FBAN|FBAV|FB_IAB|Instagram/i.test(ua);
  var isAndroid = /Android/i.test(ua);

  function buildDest(url) {
    if (isInAppBrowser && isAndroid) {
      var withoutScheme = url.replace(/^https?:\/\//, '');
      return 'intent://' + withoutScheme + '#Intent;scheme=https;package=com.whatsapp;S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
    }
    return url;
  }

  // Sem tela, sem botão — só dispara o Pixel e manda direto pro WhatsApp,
  // no carregamento da página (mesma ressalva do /go/: sem gesto do usuário,
  // navegador embutido/Chrome Android recente pode bloquear o automático —
  // o link de texto abaixo é o plano B visível nesse caso).
  window.location.href = buildDest(dest);

  document.getElementById('link').href = buildDest(dest);
  document.getElementById('fallback').style.display = 'block';
</script>
